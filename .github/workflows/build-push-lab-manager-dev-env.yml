name: Build and push lab-manager-dev-env

on:
  push:
    tags:
      - "lm-*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          # Tag is "lm-1.0.0" -> version is "1.0.0"
          VERSION="${GITHUB_REF_NAME#lm-}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./local/lab-manager-dev-env
          push: true
          tags: |
            constellab/lab-manager-dev-env:${{ steps.version.outputs.version }}
            constellab/lab-manager-dev-env:latest
