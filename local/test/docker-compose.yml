# Runs the glab image in RUN_MODE=test against a throw-away MariaDB sidecar.
#
# Usage:
#   docker compose -f docker-compose.test.yml up \
#       --abort-on-container-exit --exit-code-from glab-test
#   docker compose -f docker-compose.test.yml down -v
#
# The --exit-code-from flag propagates the test container's exit code so CI
# can read pass/fail directly.
#
# Required: a GPM settings.json at ./config.json (or override with CONFIG_PATH
# env var) describing which bricks to install.

services:
  glab-test:
    image: glab:latest
    # depends_on:
    #   test_gws_dev_db:
    #     condition: service_healthy
    environment:
      - LAB_NAME=Test
      - LAB_ID=1
      - LAB_MODE=dev
      - LAB_ENVIRONMENT=LOCAL
      - LAB_FOLDER=/lab
      - DATA_FOLDER=/data
      - LAB_PROD_API_URL=http://localhost:3000
      - LAB_DEV_API_URL=http://localhost:3000
      - RUN_MODE=test
      - VIRTUAL_HOST=
      - TEST_BRICK_NAME=gws_core,gws_qa
      - TEST_PARALLEL=true
      # COMMUNITY
      - COMMUNITY_API_URL=https://community-api-pre-prod.constellab-pre-prod.gencovery.com
      - COMMUNITY_FRONT_URL=https://community-pre-prod.gencovery.com
      # Tests connect to the MariaDB sidecar via the compose network.
      - GWS_TEST_DB_HOST=test_gws_dev_db
      - GWS_TEST_DB_PORT=3306
      - GWS_TEST_DB_USER=root
      - GWS_TEST_DB_PASSWORD=gencovery
      - GWS_TEST_DB_NAME=gws_test
      # Other
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REFLEX_ACCESS_TOKEN=${REFLEX_ACCESS_TOKEN}
      - APP_EXTERNAL_PORT=${APP_EXTERNAL_PORT:-8510}
    volumes:
      # GPM reads the brick list from /conf/config.json inside the container.
      - C:\Users\benji\Documents\Projects\Gencovery\lab-configurer\local\config-file.json:/conf/config.json:ro
      # - glab-test-app:/lab
    networks:
      - gencovery-network-dev

  test_gws_dev_db:
    image: mariadb:10.7.4
    environment:
      - MYSQL_ROOT_PASSWORD=gencovery
    ports:
      - 3408:3306
    # tmpfs makes the DB fully in-memory — faster and discarded on stop.
    tmpfs:
      - /var/lib/mysql:rw,size=2g
    # Tuning flags trade durability for write speed (safe: the DB is ephemeral).
    command:
      - --max_allowed_packet=256M
      - --innodb-flush-log-at-trx-commit=0
      - --innodb-doublewrite=0
      - --sync-binlog=0
      - --skip-log-bin
      - --innodb-flush-method=nosync
      - --innodb-buffer-pool-size=512M
      - --max-connections=200
    # healthcheck:
    #   test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 20
    networks:
      - gencovery-network-dev

networks:
  gencovery-network-dev:
    driver: bridge

volumes:
  glab-test-app:
