# This file is used for development puprose
# It only create the clab to work locally
# It is not supposed to be deployed
name: dev-env
services:
  space_db:
    image: mariadb:10
    environment:
      - MYSQL_ROOT_PASSWORD=gencovery
      - MYSQL_USER=gencoveryUser
      - MYSQL_PASSWORD=gencovery
      - MYSQL_DATABASE=spaceDb
    ports:
      - 3306:3306
    container_name: space-db
    volumes:
      - space-db:/var/lib/mysql

  community_db:
    image: mariadb:10
    environment:
      - MYSQL_ROOT_PASSWORD=gencovery
      - MYSQL_USER=gencoveryUser
      - MYSQL_PASSWORD=gencovery
      - MYSQL_DATABASE=communityDb
    ports:
      - 3310:3306
    container_name: community-db
    volumes:
      - community-db:/var/lib/mysql

  space_test_db:
    image: mariadb:10
    environment:
      - MYSQL_ROOT_PASSWORD=gencovery
      - MYSQL_USER=gencoveryUser
      - MYSQL_PASSWORD=gencovery
      - MYSQL_DATABASE=testDb
    ports:
      - 3311:3306
    container_name: space-test-db

  community_test_db:
    image: mariadb:10
    environment:
      - MYSQL_ROOT_PASSWORD=gencovery
      - MYSQL_USER=gencoveryUser
      - MYSQL_PASSWORD=gencovery
      - MYSQL_DATABASE=testDb
    ports:
      - 3312:3306
    container_name: community-test-db

  redisqueue:
    image: redis
    ports:
      - 6379:6379
    container_name: redisqueue

  mail-slurper:
    image: marcopas/docker-mailslurper
    ports:
      - "2500:2500"
      - "8086:8080"
      - "8085:8085"
    container_name: mail-slurper

  adminer:
    image: adminer
    ports:
      - 8082:8080
    networks:
      - default
      - gencovery-network-dev
      - gencovery-network-prod

  # Environment to code in remote container in linux
  dev-env:
    image: constellab/lab-dev-env
    environment:
      - LAB_NAME=MyLab
      - LAB_TOKEN=123456
      - LAB_DB_ENGINE=mariadb
      - LAB_MODE=dev
      - LAB_ENVIRONMENT=LOCAL
      - LAB_FOLDER=/lab
      - DATA_FOLDER=/data
      - LAB_PROD_API_URL=http://localhost:3000
      - LAB_DEV_API_URL=http://localhost:3000
      - LAB_MANAGER_API_URL=http://lab-manager-dev-env:3080
      - SPACE_API_KEY=123456
      - SPACE_API_URL=http://host.docker.internal:3001
      - FRONT_URL=http://localhost:4200
      - FRONT_VERSION=1.0.0
      - VIRTUAL_HOST=
      - BIOTA_BIODATA_DIR=/data/gws_biota/biodata/
      - CONDA_VERSION=latest
      - GPU=
      - GWS_MCP_SERVER_ENABLED=true
      - ENABLE_SSH_SERVER=true
      # COMMUNITY
      - COMMUNITY_API_URL=https://api.constellab.community
      - COMMUNITY_FRONT_URL=https://constellab.community
      - COMMUNITY_API_KEY=
      # GWS_CORE database
      - GWS_CORE_DB_HOST=lab-db
      - GWS_CORE_DB_USER=gws_core
      - GWS_CORE_DB_PASSWORD=gencovery
      - GWS_CORE_DB_NAME=gws_core
      - GWS_CORE_DB_PORT=3306
      # Test database
      - GWS_TEST_DB_HOST=lab-test-db
      - GWS_TEST_DB_USER=root
      - GWS_TEST_DB_PASSWORD=gencovery
      - GWS_TEST_DB_NAME=test_gws
      - GWS_TEST_DB_PORT=3306
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REFLEX_ACCESS_TOKEN=${REFLEX_ACCESS_TOKEN}
      - APP_EXTERNAL_PORT=${APP_EXTERNAL_PORT:-8510}
    # Set your own path on the volume
    volumes:
      # Named volumes bound to ${DOCKER_VOLUMES_ROOT}/dev-env on the host (see the
      # volumes section at the bottom of this file). On Windows/WSL a plain named
      # volume was used for performance :
      # https://code.visualstudio.com/remote/advancedcontainers/improve-performance#_use-a-targeted-named-volume
      - dev-env-app:/lab
      - dev-env-data:/data
      # Store VSCode server data to avoid re-downloading extensions each time
      - dev-env-vscode:/home/labuser/.vscode-server
      - dev-env-claude:/home/labuser/.claude
      # TODO TO FIX, this is created with root permission, so labuser cannot read /conf
      - ./config-file.json:/conf/config.json
      # Share git credentials by sharing ssh private key
      - ${SSH_KEY_PATH}:/home/labuser/.ssh/id_rsa
    ports:
      - 3000:3000
      - 8080:8080
      - ${APP_EXTERNAL_PORT:-8510}:8510 # For apps
    container_name: lab-dev-env
    networks:
      - gencovery-network-dev
      - gencovery-network-prod

  # Lab manager
  lab-manager-dev-env:
    image: constellab/lab-manager-dev-env
    environment:
      - VOLUME_PATH=/app
      - VIRTUAL_HOST=localhost
    volumes:
      # map the named volume to the same path as prod environment
      # data is stored in ${DOCKER_VOLUMES_ROOT}/lab-manager on the host
      - lab-manager-config:/app/conf
      - lab-manager-prod-db:/app/gws_db/gws_core/prod/mariadb
      - lab-manager-dev-db:/app/gws_db/gws_core/dev/mariadb
      - lab-manager-prod-lab:/app/prod/lab
      - lab-manager-prod-data:/app/prod/data
      - lab-manager-dev-lab:/app/dev/lab
      - lab-manager-dev-data:/app/dev/data
      # Volume on home to save the code
      - lab-manager-home:/home
      # share docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      # Share git credentials by sharing ssh private key
      - ${SSH_KEY_PATH}:/home/labuser/.ssh/id_rsa
    container_name: lab-manager-dev-env
    networks:
      - gencovery-network-dev
      - gencovery-network-prod

  # GWS Development DB
  lab-db:
    image: mariadb:10.7.4
    environment:
      - MYSQL_ROOT_PASSWORD=gencovery
      - MYSQL_USER=gws_core
      - MYSQL_PASSWORD=gencovery
      - MYSQL_DATABASE=gws_core
    ports:
      - 3307:3306
    container_name: lab-db
    volumes:
      - lab-db:/var/lib/mysql
    networks:
      - gencovery-network-dev
      - gencovery-network-prod

  # GWS Test db
  lab-test-db:
    image: mariadb:10.7.4
    # Only root credentials are needed — test databases and users are
    # created on the fly by the test suite.
    environment:
      - MYSQL_ROOT_PASSWORD=gencovery
    ports:
      - 3308:3306
    container_name: lab-test-db
    # Use tmpfs (RAM-backed filesystem) instead of a volume so the test DB
    # is ephemeral — data is discarded when the container stops, and I/O is
    # much faster since nothing hits disk.
    tmpfs:
      - /var/lib/mysql:rw,size=2g
    # MariaDB tuning flags to maximize write speed at the cost of durability,
    # which is fine for a test database that is thrown away after each run.
    command:
      - --innodb-flush-log-at-trx-commit=0 # don't flush redo log on every commit
      - --innodb-doublewrite=0 # skip the doublewrite buffer
      - --sync-binlog=0 # don't fsync the binlog on each write
      - --skip-log-bin # disable binary logging entirely
      - --innodb-flush-method=nosync # skip fsync/fdatasync calls
      - --innodb-buffer-pool-size=512M # generous buffer pool for in-memory work
      - --max-connections=200 # allow enough connections for parallel tests
    networks:
      - gencovery-network-dev
      - gencovery-network-prod
  # Run the codelab in local with same volume as dev-env
  # The local-codelab image must be built before from GPM package
  # local-codelab:
  #   image: local-codelab
  #   environment:
  #     # COMMUNITY
  #     - COMMUNITY_API_URL=https://api.constellab.community
  #     - COMMUNITY_FRONT_URL=https://constellab.community
  #     - COMMUNITY_API_KEY=
  #   ports:
  #      - 8081:8080
  #   volumes:
  #     # use the named volume lab to improve performance : https://code.visualstudio.com/remote/advancedcontainers/improve-performance#_use-a-targeted-named-volume
  #     # volume is available at \\wsl.localhost\docker-desktop-data\version-pack-data\community\docker\volumes\local_lab\_data
  #     - lab-app:/lab
  #     - lab-data:/data
  #     - lab-logs:/logs
  #     - C:\\Users\\benji\\Documents\\Projects\\Gencovery\\dev-env\\config.json:/conf/config.json

  # Service to test glab locally
  # It does not uses the same volume as dev-env
  # # It uses the same config file and database as dev-env
  # local-glab:
  #   image: glab:latest
  #   environment:
  #     - LAB_NAME=MyLab
  #     - LAB_TOKEN=123456
  #     - LAB_DB_ENGINE=mariadb
  #     - LAB_MODE=dev
  #     - LAB_ENVIRONMENT=LOCAL
  #     - LAB_PROD_API_URL=
  #     - LAB_DEV_API_URL=
  #     - SPACE_API_KEY=
  #     - SPACE_API_URL=
  #     - FRONT_URL=
  #     - FRONT_VERSION=
  #     - VIRTUAL_HOST=
  #     - BIOTA_BIODATA_DIR=/data/gws_biota/biodata/
  #     - CONDA_VERSION=latest
  #     - GPU=
  #     # COMMUNITY
  #     - COMMUNITY_API_URL=https://api.constellab.community
  #     - COMMUNITY_FRONT_URL=https://constellab.community
  #     - COMMUNITY_API_KEY=
  #     # GWS_CORE database
  #     - GWS_CORE_DB_HOST=gws_core_dev_db
  #     - GWS_CORE_DB_USER=gws_core
  #     - GWS_CORE_DB_PASSWORD=gencovery
  #     - GWS_CORE_DB_NAME=gws_core
  #     - GWS_CORE_DB_PORT=3306
  #     # GWS_BIOTA database
  #     - GWS_BIOTA_DB_HOST=gws_biota_db
  #     - GWS_BIOTA_DB_USER=gws_biota
  #     - GWS_BIOTA_DB_PASSWORD=gencovery
  #     - GWS_BIOTA_DB_NAME=gws_biota
  #     - GWS_BIOTA_DB_PORT=3306
  #   depends_on:
  #     - gws_core_dev_db
  #     # - gws_biota_dev_db
  #   # Set your own path on the volume
  #   volumes:
  #     # use the named volume lab to improve performance : https://code.visualstudio.com/remote/advancedcontainers/improve-performance#_use-a-targeted-named-volume
  #     # volume is available at \\wsl.localhost\docker-desktop-data\version-pack-data\community\docker\volumes\local_lab\_data
  #     - glab-app:/lab
  #     - glab-data:/data
  #     - glab-logs:/logs
  #     - glab-settings:/conf/settings
  # - C:\\Users\\benji\\Documents\\Projects\\Gencovery\\dev-env\\config.json:/conf/config.json
  # # Share git credentials by sharing ssh private key
  # - C:\Users\benji\.ssh\gencovery-github:/root/.ssh/id_rsa
  #   ports:
  #      - 3000:3000
  #      - 8080:8080

# All the volumes below are named volumes backed by a bind mount to a known
# folder on the host (DOCKER_VOLUMES_ROOT, defined in .env).
#
# Why not plain bind mounts (- ${DOCKER_VOLUMES_ROOT}/x:/lab) ?
#   - the volume keeps its name, so the lab manager (which creates sibling
#     containers through the docker socket) can still mount them by name
#   - docker still copies the image content into the folder on first start
#     (a plain bind mount would hide /lab, /home/labuser/... content)
# Why not pure named volumes (as before, for Windows) ?
#   - on Linux there is no bind mount performance penalty, and data ends up
#     in a folder you can browse/backup instead of /var/lib/docker/volumes
#   - the folders are created by your user (uid 1000), which is the same uid
#     as labuser in the containers, so no more root permission issue
#
# The folders MUST exist before `docker compose up`, run: bash init.sh
volumes:
  dev-env-app:
    name: dev-env-app
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_VOLUMES_ROOT}/dev-env/app
  dev-env-data:
    name: dev-env-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_VOLUMES_ROOT}/dev-env/data
  dev-env-vscode:
    name: dev-env-vscode
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_VOLUMES_ROOT}/dev-env/vscode
  dev-env-claude:
    name: dev-env-claude
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_VOLUMES_ROOT}/dev-env/claude

  # Thoses volumes are used by lab-manager when running locally
  # They are used to create volume between the lab manager container and the containers created by the lab manager
  lab-manager-home:
    name: lab-manager-home
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_VOLUMES_ROOT}/lab-manager/home
  lab-manager-config:
    name: lab-manager-config
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_VOLUMES_ROOT}/lab-manager/config
  lab-manager-prod-db:
    name: lab-manager-prod-db
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_VOLUMES_ROOT}/lab-manager/prod-db
  lab-manager-dev-db:
    name: lab-manager-dev-db
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_VOLUMES_ROOT}/lab-manager/dev-db
  lab-manager-prod-lab:
    name: lab-manager-prod-lab
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_VOLUMES_ROOT}/lab-manager/prod-lab
  lab-manager-prod-data:
    name: lab-manager-prod-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_VOLUMES_ROOT}/lab-manager/prod-data
  lab-manager-dev-lab:
    name: lab-manager-dev-lab
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_VOLUMES_ROOT}/lab-manager/dev-lab
  lab-manager-dev-data:
    name: lab-manager-dev-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_VOLUMES_ROOT}/lab-manager/dev-data

  # Databases
  space-db:
    name: space-db
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_VOLUMES_ROOT}/db/space
  community-db:
    name: community-db
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_VOLUMES_ROOT}/db/community
  lab-db:
    name: lab-db
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_VOLUMES_ROOT}/db/lab

networks:
  default:
    name: gencovery-network
  gencovery-network-dev:
    external: true
  gencovery-network-prod:
    external: true
